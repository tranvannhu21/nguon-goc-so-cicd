spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nguon_goc_so}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: validate only — Flyway is the source of truth for schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway: enabled, scans schema/ first then data/
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/schema,classpath:db/migration/data

logging.level.root=INFO
logging.level.vn.nguongocso=INFO
logging.level.org.springframework.security=DEBUG

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=86400000
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

app.upload.base-dir=./uploads
app.upload.farm-log.relative-path=farm-logs
app.upload.farm-log.max-size=5242880
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

qr.image.storage.path=./files/qr

# Đường dẫn đến mysqldump (thay đổi theo máy bạn)
app.backup.mysql-dump-path=C:/xampp/mysql/bin/mysqldump.exe

# Đường dẫn đến mysql (dùng cho restore)
app.backup.mysql-path=C:/xampp/mysql/bin/mysql.exe

# application.properties
server.port=${PORT:8080}

# Frontend URL for Invitation links
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Mail properties (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

locationiq.api-key=${LOCATIONIQ_API_KEY:}
locationiq.base-url=${LOCATIONIQ_BASE_URL:https://us1.locationiq.com/v1/reverse}
# Frontend Nginx config - serves the React SPA and reverse-proxies
# API + QR image requests to the backend service over the Docker network.
# The `backend` hostname only exists inside the Docker network - browsers
# must never call it directly, hence same-origin URLs (/api, /files).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS - backend is resolved per-request, not at startup,
    # so the container starts even when run standalone without a backend.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ------------------------------------------------------------------
    # Security headers (basic, no strict CSP - Leaflet tiles, fonts,
    # camera/QR flows and other external resources are not all verified)
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # Upload limit - matches backend spring.servlet.multipart limits (10MB)
    # ------------------------------------------------------------------
    client_max_body_size 12m;

    # ------------------------------------------------------------------
    # Internal healthcheck endpoint (used by container HEALTHCHECK).
    # Short 200 response, not written to the access log.
    # ------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------
    # SPA fallback - /login, /dashboard, /public/trace/... must all
    # return index.html on refresh instead of 404.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached long (SPA updates on deploy)
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # Vite emits content-hashed assets under /assets/ - cache long + immutable
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Backend API - keeps the /api/ prefix (variable proxy_pass passes
    # the original URI unchanged and resolves `backend` per request)
    # ------------------------------------------------------------------
    location /api/ {
        set $backend_api http://backend:8080;
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------------------------
    # Static files served by the backend: /files/qr/** is mapped to the
    # QR image storage dir (WebConfig.addResourceHandlers). Verified -
    # no other static paths (/uploads, /qr) exist in the backend.
    # ------------------------------------------------------------------
    location /files/ {
        set $backend_files http://backend:8080;
        proxy_pass $backend_files;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
